<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Name Manager</title>
    <link rel="stylesheet" href="dynamicwebpage.css">
</head>
<body>
    <div class="container">
        <h1>Student Name Manager</h1>
        <div class="input-group">
            <input type="text" placeholder="Enter student name">
            <button class="btn-add">Add Student</button>
        </div>
        <div class="counter">Total Students: 2</div>
        <div class="student-list">
            <div class="student-item">
                <span>1. Bob</span>
                <button class="btn-delete">Delete</button>
            </div>
            <div class="student-item">
                <span>2. Boina</span>
                <button class="btn-delete">Delete</button>
            </div>
        </div>
    </div>
    <div class="instruction">Click Delete on 2. Boina</div>

        <h1>Student Name Manager</h1>

            <div class="student-item">
                <span>1. Bob</span>

    </div>
</body>
</html>
